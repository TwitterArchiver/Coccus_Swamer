  世界上绝大多数的人，都是健健康康的，对自己的身体没有特殊感觉。
  <br/>
  <br/>

  <br/>
  <br/>
  毕竟人吃五谷杂粮，没有完美的肉体，有点儿不舒服是很正常的。你要是个没主意的人，再多听他叨叨几句，很快就能被他忽悠瘸了，买他的拐。
  <br/>
  <br/>
  类似的，“幸福”也是无体验的，但那些情感博主总能通过花言巧语，暗示你去“主动感知”自己的生活，就能体验出各种情感焦虑了。
