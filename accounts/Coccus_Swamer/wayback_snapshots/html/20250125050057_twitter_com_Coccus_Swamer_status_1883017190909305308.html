  房间的物品开始移位地板也随之扭曲，好像起伏的山路，崎岖的是光着脚的我双腿残废般爬行到床头。右眼开始泛起白光如被胡椒刺激到不自觉地流下眼泪，脑中轰鸣，真的有十万斤的沉重在不远处爆破。凭着感觉摸到了赛庚啶和阿普唑仑，不等嘴里什么都没有就先随意抓了几颗咽下去了。我只觉得天旋地转好想说话但是什么都说不出来，外界的一切支援都变得如此软弱无力，我只觉得我必须战胜它就像每个人都经历过的那样。
  <br/>
  等我再次醒来的时候，房间一片脏乱，除此之外什么都没有。
